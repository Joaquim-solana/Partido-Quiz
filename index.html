<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz dos símbolos dos partidos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ff;--card:#fff;--ink:#1d1b2e;--mute:#6b6880;--brand:#6c4cf5;--ok:#1fa968;--bad:#e5484d;--line:#e2dcf7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122a;--card:#201d3d;--ink:#f1eeff;--mute:#a7a2c9;--brand:#8b72ff;--ok:#2fd085;--bad:#ff6b70;--line:#34305e}}
:root[data-theme="dark"]{--bg:#14122a;--card:#201d3d;--ink:#f1eeff;--mute:#a7a2c9;--brand:#8b72ff;--ok:#2fd085;--bad:#ff6b70;--line:#34305e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:radial-gradient(circle at 20% 0%,rgba(108,76,245,.18),transparent 50%),var(--bg);display:flex;justify-content:center;padding:16px}
.app{width:100%;max-width:520px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bar{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#ff8a3d);transition:width .5s}
.pill{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
#mute{cursor:pointer;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:0 10px 30px rgba(60,40,140,.15);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}to{opacity:1;transform:none}}
.stage{height:190px;display:flex;align-items:center;justify-content:center;border-radius:16px;background:linear-gradient(135deg,rgba(108,76,245,.12),rgba(255,138,61,.15));margin-bottom:14px;overflow:hidden}
.stage svg{width:150px;height:150px;animation:float 2.6s ease-in-out infinite,zoom .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes zoom{from{transform:scale(.2) rotate(-25deg);opacity:0}}
h1{margin:6px 0;font-size:26px;text-align:center}
h2{margin:0 0 12px;font-size:19px;text-align:center}
p{color:var(--mute);line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-weight:700;font-size:17px;padding:14px 8px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .15s,border-color .15s;animation:pop .4s backwards}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
.opt:hover:not(:disabled){transform:translateY(-3px);border-color:var(--brand)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:jump .5s}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .45s}
.opt:disabled{cursor:default}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes jump{40%{transform:scale(1.1)}}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--brand);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer;animation:pop .35s}
.btn:active{transform:scale(.97)}
.why{margin-top:12px;padding:12px;border-radius:12px;background:rgba(108,76,245,.1);font-size:15px;line-height:1.45;animation:pop .35s}
.big{font-size:64px;text-align:center;animation:float 2s infinite}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px 0 14px}
.chip{font:inherit;font-weight:700;padding:9px 14px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.15s}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;transform:scale(1.06)}
.lbl{text-align:center;font-weight:800;font-size:14px;color:var(--mute);margin-top:6px}
.tbar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;width:100%;background:var(--ok);transition:width .1s linear,background .3s}
.tbar.low i{background:var(--bad)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:9}
.hide{display:none}
</style>
</head>

function show(){const q=deck[i],L=LV[q.d];let o=shuffle([q.a,...(Array.isArray(q.p)?q.p:shuffle(PL[q.p].filter(x=>x!==q.a)).slice(0,3))]);
if(q.d==1)o=o.filter((x,k)=>x===q.a||k!==o.findIndex(y=>y!==q.a));
view.innerHTML=`<div class="card"><div class="lbl" style="margin:0 0 8px">${L.e} ${L.n} · Pergunta ${i+1} de ${deck.length}</div><div class="tbar" id="tb"><i id="ti"></i></div><div class="stage">${V(q.v)}</div><h2>${q.t}</h2><div class="opts" style="${o.length==3?"grid-template-columns:1fr":""}">${o.map(x=>`<button class="opt">${x}</button>`).join("")}</div><div id="fb"></div></div>`;
view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,q));
const T=L.t;left=T;clearInterval(tm);
tm=setInterval(()=>{left-=.1;$("ti").style.width=Math.max(0,left/T*100)+"%";if(left<=T*.3){$("tb").classList.add("low");if(Math.abs(left-Math.round(left))<.05&&left>0)tone(880,0,.06,"square",.06)}if(left<=0){clearInterval(tm);answer(null,q)}},100)}
function answer(b,q){clearInterval(tm);const all=[...view.querySelectorAll(".opt")];all.forEach(x=>x.disabled=true);
const right=b&&b.textContent===q.a;
if(right){score+=10*q.d+Math.ceil(left);hits++;streak++;b.classList.add("ok");sfx.ok();boom(streak>2?160:80)}else{streak=0;if(b)b.classList.add("bad");sfx.bad()}
all.find(x=>x.textContent===q.a).classList.add("ok");
$("streak").textContent="🔥 "+streak;$("score").textContent="⭐ "+score;$("prog").style.width=((i+1)/deck.length*100)+"%";
$("fb").innerHTML=`<div class="why">${right?"✅ Acertou! ":b?"❌ Quase! ":"⏰ O tempo acabou! "}${q.w}</div><button class="btn" id="nx">${i<deck.length-1?"Próxima":"Ver resultado"}</button>`;
$("nx").onclick=()=>{sfx.click();i++;i<deck.length?show():end()}}
function end(){sfx.win();boom(220);const n=deck.length;
const m=hits==n?["🏆","Perfeito! Você é craque nos símbolos."]:hits>=n*.6?["🎉","Muito bem! Você conhece bastante."]:["📚","Bom começo! Tente de novo."];
view.innerHTML=`<div class="card"><div class="big">${m[0]}</div><h1>${hits} de ${n} · ${score} pts</h1><p style="text-align:center">${m[1]}</p><button class="btn" id="again">Jogar de novo</button><button class="btn" id="menu" style="background:var(--line);color:var(--ink)">Voltar ao menu</button></div>`;
$("again").onclick=()=>{sfx.click();play(mode)};$("menu").onclick=()=>{sfx.click();start()}}
start();
</script>
</body>
</html>
